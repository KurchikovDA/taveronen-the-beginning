# Name of the workflow, it is shown in the Actions tab on GitHub
name: GUT tests

# When to run: on every push to any branch, and also by hand with a button.
# By hand you can also choose "publish": off = a dry run for itch.io (nothing is uploaded), on = a real upload (only from the main branch)
on:
  push:
  workflow_dispatch:
    inputs:
      publish:
        description: "Really upload the builds to itch.io (leave it off for a safe dry run: nothing is uploaded)"
        type: boolean
        default: false

# The job may write to the repository: it needs this to publish the Allure report to the gh-pages branch
permissions:
  contents: write

# Versions of the tools in one place, so they are easy to find and change (the jobs use them).
# They are fixed on purpose: a new version of a tool must not break CI "by itself".
env:
  GODOT_VERSION: "4.7.2"
  BUTLER_VERSION: "15.32.0"

jobs:
  test:
    # GitHub gives us a clean Ubuntu (Linux) computer for each run
    runs-on: ubuntu-24.04

    steps:
      # Step 1: copy the project from the repository to the computer
      - name: Check out the repository
        uses: actions/checkout@v5

      # Step 2: download Godot (Linux build) and make it a "godot" command
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      # Step 3: the .godot folder is not in the repository, so import the project
      # once to build it. "|| true" means: do not fail if Godot exits with a warning
      - name: Import the project
        run: godot --headless --import || true

      # Step 4: run all tests without a window. Which folders to scan is set in .gutconfig.json.
      # -gexit closes Godot after the run; failed tests make this step fail (red cross).
      # -gjunit_xml_file makes GUT save the results as a JUnit XML (extensible markup language) file for Allure
      - name: Run GUT tests
        run: |
          mkdir -p allure-results
          godot --headless -s addons/gut/gut_cmdln.gd -gexit -gjunit_xml_file=res://allure-results/junit.xml

      # Step 5: the smoke test. It presses the buttons that change the scene and checks that the right scene opens.
      # "if: always()" = run it even when GUT failed, so one red step does not hide the other one.
      # The test ends with exit code 1 if any check failed, and that makes this step fail (red cross).
      - name: Run smoke test
        if: always()
        run: godot --headless -s res://test/smoke/smoke_scene_changes.gd

      # Step 6: turn the XML file into an Allure HTML report.
      # "if: always()" = do it even when some tests failed, so the report shows the failures
      - name: Build Allure report
        if: always()
        run: npx --yes allure@3.22.1 generate allure-results -o allure-report

      # Step 7: publish the report to the gh-pages branch (GitHub Pages shows it as a website).
      # Only for the main branch, so a broken test branch does not replace the public report
      - name: Publish Allure report
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

  build:
    # Build the game for Windows and for the web, test the web build, save the files as artifacts (downloadable zip files) and, at the end, upload them to itch.io.
    # needs: test = start only after the whole "test" job is green, so a broken game is never built.
    needs: test
    # Run only for a version tag (for example v1.0.5) or by hand with the "Run workflow" button
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    # Stop the job if it hangs for more than 20 minutes, so it does not burn the free minutes
    timeout-minutes: 20

    steps:
      # Step 1: copy the project from the repository to the computer
      - name: Check out the repository
        uses: actions/checkout@v5

      # Step 1b: for a version tag (for example v1.0.5) the game version in export_presets.cfg must be the same (1.0.5).
      # If not, we stop at once, before spending minutes on the build. The tag text without the first "v" is compared with both version fields.
      - name: Check the tag matches the game version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          for KEY in file_version product_version; do
            grep -q "application/${KEY}=\"${TAG_VERSION}\"" export_presets.cfg || { echo "Tag ${GITHUB_REF_NAME} does not match application/${KEY} in export_presets.cfg"; exit 1; }
          done

      # Step 2: download Godot (Linux build) and make it a "godot" command, same as in the test job
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      # Step 3: download the export templates (the ready game "engines" that Godot puts into a build).
      # We take only the 4 files we need, not the whole 1.3 GB archive. mkdir -p first: unzip cannot create a nested folder.
      # The folder name must be exactly the Godot version + ".stable", otherwise Godot does not find the templates.
      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz "templates/version.txt" "templates/web_nothreads_release.zip" "templates/windows_release_x86_64.exe" "templates/windows_release_x86_64_console.exe" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Step 4: import the project once, to build the .godot folder (same as in the test job)
      - name: Import the project
        run: godot --headless --import || true

      # Step 5: export both builds into the dist folder (the path given here replaces the export path from the preset).
      # mkdir -p creates the folders first, Godot does not create them. A failed export gives exit code 1 = red cross.
      - name: Export Windows and Web
        run: |
          mkdir -p "dist/windows" "dist/web"
          godot --headless --export-release "Windows Desktop" "dist/windows/Taveronen The Beginning.exe"
          godot --headless --export-release "Web" "dist/web/index.html"
          ls -la dist/windows dist/web

      # Step 6: save the Windows build as an artifact (a zip file you can download from the run page)
      - name: Upload the Windows build
        uses: actions/upload-artifact@v6
        with:
          name: taveronen-windows
          path: dist/windows
          if-no-files-found: error
          retention-days: 7

      # Step 7: save the Web build the same way
      - name: Upload the Web build
        uses: actions/upload-artifact@v6
        with:
          name: taveronen-web
          path: dist/web
          if-no-files-found: error
          retention-days: 7

      # Step 8: install the tools for the browser test (Python packages and the Chromium browser).
      # We use a virtual environment (.venv = a private folder for packages) so we do not touch the system Python.
      # The packages and their exact versions are listed in test/e2e/requirements.txt (-r = read the list from this file).
      # The Playwright version decides which Chromium is downloaded, so the browser is fixed too.
      # --with-deps also installs the system libraries that Chromium needs on Linux.
      - name: Install Playwright
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install -r test/e2e/requirements.txt
          .venv/bin/python -m playwright install --with-deps chromium

      # Step 9: run the web smoke test on the Web build we just exported.
      # The test looks for the build in dist/web by default, so no settings are needed here.
      # A failed check gives exit code 1 = red cross.
      - name: Run web smoke test
        run: .venv/bin/python -m pytest test/e2e

      # Step 10: save the screenshots made by the test, so you can look at them from the run page.
      # "if: always()" = do it even when the test failed, because the pictures help most when something is wrong
      - name: Upload the screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: e2e-screenshots
          path: e2e-output
          if-no-files-found: ignore
          retention-days: 7

      # Step 11: download butler (the itch.io upload tool) and make it a "butler" command.
      # The version is fixed (BUTLER_VERSION at the top of this file) instead of LATEST, so a new butler cannot surprise us.
      # Only for the main branch or a version tag, so a test branch never gets near itch.io.
      - name: Install butler
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        run: |
          wget -q -O butler.zip https://broth.itch.zone/butler/linux-amd64/${BUTLER_VERSION}/archive/default
          unzip -q butler.zip -d butler-files
          sudo mv butler-files/butler /usr/local/bin/butler
          sudo chmod +x /usr/local/bin/butler
          butler version

      # Step 12: upload both builds to itch.io. This step runs only when every step above is green.
      # BUTLER_API_KEY is the secret key from GitHub Secrets, butler reads it from this variable by itself.
      # DRY_RUN_FLAG is "--dry-run" when the run was started by hand with "publish" off: butler only shows what it would upload.
      # A version tag always uploads for real. The game version for itch.io is read from export_presets.cfg.
      - name: Publish to itch.io
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
          DRY_RUN_FLAG: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && '--dry-run' || '' }}
        run: |
          VERSION=$(grep -oP 'application/product_version="\K[^"]+' export_presets.cfg)
          echo "Game version: ${VERSION}, dry run flag: '${DRY_RUN_FLAG}'"
          butler push ${DRY_RUN_FLAG} dist/windows voljulan/taveronen-the-beginning:windows --userversion "${VERSION}"
          butler push ${DRY_RUN_FLAG} dist/web voljulan/taveronen-the-beginning:web --userversion "${VERSION}"