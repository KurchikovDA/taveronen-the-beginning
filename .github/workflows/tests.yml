# Name of the workflow, it is shown in the Actions tab on GitHub.
# This file only runs the tests. The release (build + upload to itch.io) lives in release.yml and calls this file first.
name: Tests

# When to run:
# - on every push to any branch (branches: ["**"] = all branches; pushing a version tag is NOT included, the tag starts release.yml instead)
# - when another workflow calls it (workflow_call = "this file can be used as a ready-made block"; release.yml does it)
on:
  push:
    branches: ["**"]
  workflow_call:

# The job may write to the repository: it needs this to publish the Allure report to the gh-pages branch
permissions:
  contents: write

jobs:
  test:
    # GitHub gives us a clean Ubuntu (Linux) computer for each run
    runs-on: ubuntu-24.04

    steps:
      # Step 1: copy the project from the repository to the computer
      - name: Check out the repository
        uses: actions/checkout@v5

      # Step 2: install Godot and import the project (the steps live in .github/actions/setup-godot/action.yml,
      # release.yml uses the same ones). This works only after the checkout, because the action is a file of the repository.
      # The Godot version is set in that action file, so it is not written here.
      - name: Set up Godot
        uses: ./.github/actions/setup-godot

      # Step 3: run all tests without a window. Which folders to scan is set in .gutconfig.json.
      # -gexit closes Godot after the run; failed tests make this step fail (red cross).
      # -gjunit_xml_file makes GUT save the results as a JUnit XML (extensible markup language) file for Allure
      - name: Run GUT tests
        run: |
          mkdir -p allure-results
          godot --headless -s addons/gut/gut_cmdln.gd -gexit -gjunit_xml_file=res://allure-results/junit.xml

      # Step 4: the smoke test. It presses the buttons that change the scene and checks that the right scene opens.
      # "if: always()" = run it even when GUT failed, so one red step does not hide the other one.
      # The test ends with exit code 1 if any check failed, and that makes this step fail (red cross).
      - name: Run smoke test
        if: always()
        run: godot --headless -s res://test/smoke/smoke_scene_changes.gd

      # Step 5: turn the XML file into an Allure HTML report.
      # "if: always()" = do it even when some tests failed, so the report shows the failures
      - name: Build Allure report
        if: always()
        run: npx --yes allure@3.22.1 generate allure-results -o allure-report

      # Step 6: publish the report to the gh-pages branch (GitHub Pages shows it as a website).
      # Only for the main branch, so a broken test branch does not replace the public report
      - name: Publish Allure report
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report