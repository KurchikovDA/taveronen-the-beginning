# Name of the workflow, it is shown in the Actions tab on GitHub
name: GUT tests

# When to run: on every push to any branch, and also by hand with a button
on:
  push:
  workflow_dispatch:

# The job may write to the repository: it needs this to publish the Allure report to the gh-pages branch
permissions:
  contents: write

# Godot version in one place, so it is easy to change later (both jobs use it)
env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    # GitHub gives us a clean Ubuntu (Linux) computer for each run
    runs-on: ubuntu-24.04

    steps:
      # Step 1: copy the project from the repository to the computer
      - name: Check out the repository
        uses: actions/checkout@v5

      # Step 2: download Godot (Linux build) and make it a "godot" command
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      # Step 3: the .godot folder is not in the repository, so import the project
      # once to build it. "|| true" means: do not fail if Godot exits with a warning
      - name: Import the project
        run: godot --headless --import || true

      # Step 4: run all tests without a window. Which folders to scan is set in .gutconfig.json.
      # -gexit closes Godot after the run; failed tests make this step fail (red cross).
      # -gjunit_xml_file makes GUT save the results as a JUnit XML (extensible markup language) file for Allure
      - name: Run GUT tests
        run: |
          mkdir -p allure-results
          godot --headless -s addons/gut/gut_cmdln.gd -gexit -gjunit_xml_file=res://allure-results/junit.xml

      # Step 5: the smoke test. It presses the buttons that change the scene and checks that the right scene opens.
      # "if: always()" = run it even when GUT failed, so one red step does not hide the other one.
      # The test ends with exit code 1 if any check failed, and that makes this step fail (red cross).
      - name: Run smoke test
        if: always()
        run: godot --headless -s res://test/smoke/smoke_scene_changes.gd

      # Step 6: turn the XML file into an Allure HTML report.
      # "if: always()" = do it even when some tests failed, so the report shows the failures
      - name: Build Allure report
        if: always()
        run: npx --yes allure@3.22.1 generate allure-results -o allure-report

      # Step 7: publish the report to the gh-pages branch (GitHub Pages shows it as a website).
      # Only for the main branch, so a broken test branch does not replace the public report
      - name: Publish Allure report
        if: always() && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report

  build:
    # Build the game for Windows and for the web. Nothing is published here, the files are only saved as artifacts (downloadable zip files).
    # needs: test = start only after the whole "test" job is green, so a broken game is never built.
    needs: test
    # Run only for a version tag (for example v1.0.5) or by hand with the "Run workflow" button
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      # Step 1: copy the project from the repository to the computer
      - name: Check out the repository
        uses: actions/checkout@v5

      # Step 2: download Godot (Linux build) and make it a "godot" command, same as in the test job
      - name: Install Godot
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot

      # Step 3: download the export templates (the ready game "engines" that Godot puts into a build).
      # We take only the 4 files we need, not the whole 1.3 GB archive. mkdir -p first: unzip cannot create a nested folder.
      # The folder name must be exactly the Godot version + ".stable", otherwise Godot does not find the templates.
      - name: Install export templates
        run: |
          wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz "templates/version.txt" "templates/web_nothreads_release.zip" "templates/windows_release_x86_64.exe" "templates/windows_release_x86_64_console.exe" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      # Step 4: import the project once, to build the .godot folder (same as in the test job)
      - name: Import the project
        run: godot --headless --import || true

      # Step 5: the Windows icon is saved in export_presets.cfg as a UID (a hidden id) that exists only on the computer where it was chosen.
      # A clean copy from GitHub does not know it, and the exe would get the standard Godot icon without any error.
      # So we replace the id with the plain path of the icon file, and the next line fails the step if the replace did not happen.
      - name: Use the icon by path
        run: |
          sed -i 's#application/icon="uid://[a-z0-9]*"#application/icon="res://tavern.ico"#' export_presets.cfg
          grep -q 'application/icon="res://tavern.ico"' export_presets.cfg

      # Step 6: export both builds into the dist folder (the path given here replaces the export path from the preset).
      # mkdir -p creates the folders first, Godot does not create them. A failed export gives exit code 1 = red cross.
      - name: Export Windows and Web
        run: |
          mkdir -p "dist/windows" "dist/web"
          godot --headless --export-release "Windows Desktop" "dist/windows/Taveronen The Beginning.exe"
          godot --headless --export-release "Web" "dist/web/index.html"
          ls -la dist/windows dist/web

      # Step 7: save the Windows build as an artifact (a zip file you can download from the run page)
      - name: Upload the Windows build
        uses: actions/upload-artifact@v6
        with:
          name: taveronen-windows
          path: dist/windows
          if-no-files-found: error
          retention-days: 7

      # Step 8: save the Web build the same way
      - name: Upload the Web build
        uses: actions/upload-artifact@v6
        with:
          name: taveronen-web
          path: dist/web
          if-no-files-found: error
          retention-days: 7