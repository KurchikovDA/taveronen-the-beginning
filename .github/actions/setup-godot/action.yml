# A composite action = a small reusable block of steps that both workflows (tests.yml and release.yml) can call with one line.
# Without it the same "install Godot" steps would be written twice and could drift apart.
name: Set up Godot
description: Installs Godot, optionally the export templates, and imports the project

# The settings the caller can pass in (the "with:" block of the step that calls this action)
inputs:
  godot-version:
    description: "The Godot version. This default is the ONLY place in the repository where the version is written, change it here"
    required: false
    default: "4.7.2"
  install-templates:
    description: "Install the export templates too ('true' or 'false'); only the release build needs them"
    required: false
    default: "false"

runs:
  # "composite" = this action is just a list of steps, no own code
  using: composite
  steps:
    # Download Godot (Linux build) and make it a "godot" command.
    # Every "run" step of a composite action must say which shell it uses ("shell: bash").
    - name: Install Godot
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
        sudo mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 /usr/local/bin/godot
        sudo chmod +x /usr/local/bin/godot

    # Download the export templates (the ready game "engines" that Godot puts into a build).
    # Only when the caller asked for them. We take only the 4 files we need, not the whole 1.3 GB archive.
    # mkdir -p first: unzip cannot create a nested folder.
    # The folder name must be exactly the Godot version + ".stable", otherwise Godot does not find the templates.
    - name: Install export templates
      if: inputs.install-templates == 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: |
        wget -q https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
        mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
        unzip -q -j Godot_v${GODOT_VERSION}-stable_export_templates.tpz "templates/version.txt" "templates/web_nothreads_release.zip" "templates/windows_release_x86_64.exe" "templates/windows_release_x86_64_console.exe" -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

    # The .godot folder is not in the repository, so import the project once to build it.
    # "|| true" means: do not fail if Godot exits with a warning
    - name: Import the project
      shell: bash
      run: godot --headless --import || true